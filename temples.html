<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore beautiful temples across Central America and learn about their locations.">
    <meta name="author" content="Yesenia Cuellar">
    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Temple Album</h1>

            <button type="button" id="menu-button" aria-label="Open menu" aria-expanded="false">
                ☰
            </button>
        </div>

        <nav id="nav-menu">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h2>Temples of Central America</h2>

        <div class="temple-grid">

            <figure>
                <img src="images/templo1.webp" alt="Guatemala City Temple" loading="lazy">
                <figcaption>Guatemala City Temple – Guatemala</figcaption>
            </figure>

            <figure>
                <img src="images/templo2.webp" alt="Quetzaltenango Temple" loading="lazy">
                <figcaption>Quetzaltenango Temple – Guatemala</figcaption>
            </figure>

            <figure>
                <img src="images/templo3.webp" alt="Cobán Temple" loading="lazy">
                <figcaption>Cobán Temple – Guatemala</figcaption>
            </figure>

            <figure>
                <img src="images/templo4.webp" alt="Miraflores Temple" loading="lazy">
                <figcaption>Miraflores Temple – Guatemala</figcaption>
            </figure>

            <figure>
                <img src="images/templo5.webp" alt="San José Costa Rica Temple" loading="lazy">
                <figcaption>San José Temple – Costa Rica</figcaption>
            </figure>

            <figure>
                <img src="images/templo6.webp" alt="Panama City Temple" loading="lazy">
                <figcaption>Panama City Temple – Panama</figcaption>
            </figure>

            <figure>
                <img src="images/templo7.webp" alt="San Salvador Temple" loading="lazy">
                <figcaption>San Salvador Temple – El Salvador</figcaption>
            </figure>

            <figure>
                <img src="images/templo8.webp" alt="Tegucigalpa Temple" loading="lazy">
                <figcaption>Tegucigalpa Temple – Honduras</figcaption>
            </figure>

            <figure>
                <img src="images/templo9.webp" alt="San Pedro Sula Temple" loading="lazy">
                <figcaption>San Pedro Sula Temple – Honduras</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Yesenia Cuellar | Costa Rica</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
