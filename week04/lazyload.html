<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>
    <meta name="description" content="A demonstration of lazy loading images using HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Images</h1>

        <img src="https://picsum.photos/id/1011/400/600" alt="Mountain landscape" width="400" height="600"
            loading="lazy">

        <img src="https://picsum.photos/id/1015/400/600" alt="Beautiful mountain scenery" width="400" height="600"
            loading="lazy">

        <img src="https://picsum.photos/id/1016/400/600" alt="Nature and forest" width="400" height="600"
            loading="lazy">

        <img src="https://picsum.photos/id/1020/400/600" alt="Wildlife in nature" width="400" height="600"
            loading="lazy">

        <img src="https://picsum.photos/id/1039/400/600" alt="Waterfall landscape" width="400" height="600"
            loading="lazy">

        <img src="https://picsum.photos/id/1043/400/600" alt="Mountain and lake" width="400" height="600"
            loading="lazy">
    </main>

    <footer>
        <p>WDD 131 - Lazy Loading Activity</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
